name: Ministry Mapper Release

on:
  push:
    branches:
      - master

permissions:
  contents: read # for checkout

jobs:
  release:
    name: Release Application
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
    env:
      HUSKY: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # semantic-release reads back to the last tag, so a shallow clone can
          # yield the wrong version.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A push straight to master never runs PR Checks, so the same gates run
      # here before anything is released or deployed.
      - name: Check formatting
        run: npm run prettier

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build the project
        run: npm run build

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: npx semantic-release

      # Without --fail-with-body curl exits 0 on 4xx/5xx, so a stale token would
      # report success and deploy nothing.
      - name: Deploy to Coolify
        run: |
          curl --fail-with-body --silent --show-error \
            --request GET '${{ secrets.COOLIFY_WEBHOOK }}' \
            --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'
