name: PR Checks

on:
  pull_request:
    branches:
      - master
      - staging

permissions:
  contents: read # for checkout

jobs:
  test-and-build:
    name: Test and Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run prettier

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build the project
        run: npm run build
